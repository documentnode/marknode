name: Extensions

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - '.github/workflows/extensions.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - '.github/workflows/extensions.yml'

permissions:
  contents: read

concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: extensions

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck every extension against types/marknode.d.ts
        run: npm run typecheck

      - name: Build the examples
        run: npm run build

      - name: Fail if a committed .js differs from its TypeScript source
        run: git diff --exit-code

      - name: Fail if the build produced files that are not committed
        run: |
          untracked="$(git status --porcelain)"
          if [ -n "$untracked" ]; then
            echo "Build output is not committed:"
            echo "$untracked"
            exit 1
          fi
